<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiDex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="device">
        <div class="device-head">
            <h1>DigiDex</h1>
            <div class="led" id="led" aria-hidden="true"></div>
        </div>

        <form class="search" id="searchForm" autocomplete="off">
            <input type="text" id="searchInput" list="names" aria-label="Digimon name or number"
                placeholder="Name or number, like Agumon or 9">
            <button type="submit" class="btn">Scan</button>
        </form>
        <datalist id="names"></datalist>

        <div class="bezel">
            <div class="lcd" aria-live="polite">
                <div id="message" class="message">Loading Digimon...</div>

                <div id="card" hidden>
                    <div class="lcd-top">
                        <span id="number"></span>
                        <span id="stage"></span>
                    </div>
                    <div class="portrait" id="portrait">
                        <img id="image" alt="">
                    </div>
                    <h2 class="digimon-name" id="name"></h2>
                    <ul class="stages" id="stages" aria-hidden="true">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                    <div class="stage-names" aria-hidden="true">
                        <span>Fresh</span><span>Rookie</span><span>Champion</span><span>Mega</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="browse">
            <button type="button" class="btn" id="prev" aria-label="Previous Digimon">Previous</button>
            <span class="count" id="count"></span>
            <button type="button" class="btn" id="next" aria-label="Next Digimon">Next</button>
        </div>
    </main>

    <script>
        const API_URL = 'https://digimon-api.vercel.app/api/digimon';

        // Evolution order. "Training" is the same stage as "In Training".
        // "Armor" is a side branch, so it lights no pip on the ladder.
        const STAGES = ['fresh', 'in training', 'rookie', 'champion', 'ultimate', 'mega'];

        var list = [];
        var index = -1; // -1 means nothing is on screen yet

        var elMessage = document.getElementById('message');
        var elCard = document.getElementById('card');
        var elNumber = document.getElementById('number');
        var elStage = document.getElementById('stage');
        var elPortrait = document.getElementById('portrait');
        var elImage = document.getElementById('image');
        var elName = document.getElementById('name');
        var elStages = document.querySelectorAll('#stages li');
        var elCount = document.getElementById('count');
        var elLed = document.getElementById('led');
        var elInput = document.getElementById('searchInput');
        var elNames = document.getElementById('names');

        function showMessage(text) {
            elCard.hidden = true;
            elMessage.hidden = false;
            elMessage.textContent = text;
        }

        function show(i) {
            index = i;
            var d = list[i];

            elMessage.hidden = true;
            elCard.hidden = false;

            elNumber.textContent = 'No. ' + String(i + 1).padStart(3, '0');
            elStage.textContent = d.level;
            elName.textContent = d.name;
            elCount.textContent = (i + 1) + ' of ' + list.length;

            var key = d.level.toLowerCase() === 'training' ? 'in training' : d.level.toLowerCase();
            var pos = STAGES.indexOf(key);
            elStages.forEach(function (li, n) {
                li.classList.toggle('on', pos !== -1 && n <= pos);
            });

            elImage.alt = d.name;

            // Play the scan-in only once the new image is ready, so the
            // previous Digimon's picture never flashes on screen.
            function reveal() {
                elLed.classList.remove('on');
                elImage.style.visibility = 'visible';
                elPortrait.classList.remove('scan');
                void elPortrait.offsetWidth;
                elPortrait.classList.add('scan');
            }

            if (elImage.getAttribute('src') === d.img) {
                // same picture as before: nothing to load
                reveal();
                return;
            }

            // LED lights while the image loads
            elLed.classList.add('on');
            elImage.style.visibility = 'hidden';
            elPortrait.classList.remove('scan');
            elImage.onload = reveal;
            elImage.onerror = function () {
                elLed.classList.remove('on');
                elImage.style.visibility = 'visible';
            };
            elImage.src = d.img;
        }

        function search() {
            var query = elInput.value.trim().toLowerCase();
            if (!query || !list.length) return;

            var i = -1;
            if (/^\d+$/.test(query)) {
                var n = parseInt(query, 10);
                if (n >= 1 && n <= list.length) i = n - 1;
            } else {
                i = list.findIndex(function (d) { return d.name.toLowerCase() === query; });
                if (i === -1) i = list.findIndex(function (d) { return d.name.toLowerCase().includes(query); });
            }

            if (i === -1) {
                showMessage('No match for "' + elInput.value.trim() + '". Try a name, or a number from 1 to ' + list.length + '.');
                elCount.textContent = '';
                return;
            }
            show(i);
        }

        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            search();
        });
        document.getElementById('prev').addEventListener('click', function () {
            if (!list.length) return;
            show(index < 0 ? list.length - 1 : (index - 1 + list.length) % list.length);
        });
        document.getElementById('next').addEventListener('click', function () {
            if (list.length) show((index + 1) % list.length);
        });

        (async function init() {
            try {
                var response = await fetch(API_URL);
                list = await response.json();

                list.forEach(function (d) {
                    var opt = document.createElement('option');
                    opt.value = d.name;
                    elNames.appendChild(opt);
                });

                showMessage('Type a name or number, then press Scan. Or use Next to browse.');
                elCount.textContent = list.length + ' Digimon';
            } catch (err) {
                showMessage('Could not load the Digimon list. Check your connection and reload the page.');
            }
        })();
    </script>
</body>

</html>
