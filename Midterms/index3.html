<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiDex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Rubik:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header class="site-header">
            <a class="portfolio-btn" href="https://patrick-star-662006.github.io/">&larr; Portfolio</a>
            <div>
                <p class="brand">DigiDex</p>
                <p class="tagline">Your pocket guide to the Digital World</p>
            </div>
            <span aria-hidden="true"></span>
        </header>

        <main class="device">
            <div class="device-head">
                <h1>DigiDex</h1>
                <div class="led" id="led" aria-hidden="true"></div>
            </div>

            <form class="search" id="searchForm" autocomplete="off">
                <input type="text" id="searchInput" aria-label="Digimon name or ID number"
                    placeholder="Name or ID, like Agumon or 1">
                <button type="submit" class="btn">Scan</button>
            </form>

            <div class="bezel">
                <div class="lcd" aria-live="polite">
                    <div id="message" class="message" hidden></div>
                    <ul class="list" id="list"></ul>
                </div>
            </div>

            <div class="browse">
                <button type="button" class="btn" id="prev" aria-label="Previous page">Previous</button>
                <span class="count" id="count">Page 1</span>
                <button type="button" class="btn" id="next" aria-label="Next page">Next</button>
            </div>
        </main>

        <footer class="site-footer">
            <p>Data provided by <a href="https://digi-api.com" target="_blank" rel="noopener">Digi-API</a></p>
            <p class="fine">Unofficial fan project. Digimon is &copy; Bandai / Toei Animation. &middot; <span
                    id="year"></span></p>
        </footer>
    </div>

    <script>
        const API = 'https://digi-api.com/api/v1/digimon';
        const PER_PAGE = 10;
        const NETWORK_ERROR = 'Could not reach the Digimon API. Check your connection and try again.';

        const $ = (id) => document.getElementById(id);
        const elList = $('list');
        const elMessage = $('message');
        const elLed = $('led');
        const elCount = $('count');
        const elInput = $('searchInput');

        // Page in the URL starts at 1; the API starts at 0.
        let page = parseInt(new URLSearchParams(location.search).get('page'), 10);
        if (!page || page < 1) page = 1;
        let finalPage = null; // filled in from the API
        let token = 0;

        async function getJson(url) {
            const res = await fetch(url);
            if (res.status === 404) return null;
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        function setLed(on) {
            elLed.classList.toggle('on', on);
        }

        function showMessage(text) {
            setLed(false);
            elList.hidden = true;
            elMessage.hidden = false;
            elMessage.textContent = text;
        }

        function renderList(items) {
            elMessage.hidden = true;
            elList.hidden = false;
            elList.replaceChildren();
            elList.scrollTop = 0;

            items.forEach((item) => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = 'view.html?id=' + item.id + '&page=' + page;

                const img = document.createElement('img');
                img.src = item.image || '';
                img.alt = '';
                img.loading = 'lazy';

                const num = document.createElement('span');
                num.className = 'num';
                num.textContent = String(item.id).padStart(4, '0');

                const nm = document.createElement('span');
                nm.className = 'nm';
                nm.textContent = item.name;

                a.append(img, num, nm);
                li.appendChild(a);
                elList.appendChild(li);
            });
        }

        function updateCount() {
            elCount.textContent = 'Page ' + page + (finalPage ? ' / ' + finalPage : '');
        }

        async function loadPage() {
            const mine = ++token;
            updateCount();
            showMessage('Loading...');
            setLed(true);
            try {
                const data = await getJson(API + '?page=' + (page - 1) + '&pageSize=' + PER_PAGE);
                if (mine !== token) return;

                const items = data ? (data.content || []) : [];
                if (data && data.pageable && data.pageable.totalPages) {
                    finalPage = data.pageable.totalPages;
                }

                // Page number out of range (e.g. ?page=9999): fall back to page 1
                if (!items.length && page !== 1) {
                    page = 1;
                    return loadPage();
                }
                if (!items.length) {
                    showMessage('No Digimon found.');
                    return;
                }

                history.replaceState(null, '', '?page=' + page);
                updateCount();
                renderList(items);
                setLed(false);
            } catch (err) {
                if (mine === token) showMessage(NETWORK_ERROR);
            }
        }

        // Pagination: wraps around at both ends
        function prev() {
            page -= 1;
            function prev() {
                if (page <= 1) return;
                page -= 1;
                loadPage();
            }
        }

        function next() {
            page += 1;
            if (finalPage && page > finalPage) page = 1;
            loadPage();
        }

        // Search: jump straight to the matching Digimon's detail page
        async function findId(q) {
            if (/^\d+$/.test(q)) return Number(q);
            const d = await getJson(API + '/' + encodeURIComponent(q));
            if (d && d.id) return d.id;
            const list = await getJson(API + '?name=' + encodeURIComponent(q) + '&pageSize=1');
            const items = list ? (Array.isArray(list) ? list : list.content) : [];
            return items && items[0] && items[0].id ? items[0].id : null;
        }

        $('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = elInput.value.trim();
            if (!q) return;
            setLed(true);
            try {
                const id = await findId(q);
                if (!id) {
                    showMessage('No match for "' + q + '". Try another name, or an ID number.');
                    return;
                }
                location.href = 'view.html?id=' + id + '&page=' + page;
            } catch (err) {
                showMessage(NETWORK_ERROR);
            }
        });

        $('prev').addEventListener('click', prev);
        $('next').addEventListener('click', next);
        $('year').textContent = new Date().getFullYear();

        loadPage();
    </script>
</body>

</html>
